    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#555b63"/><stop offset="0.18" stop-color="#f4f5f5"/><stop offset="0.35" stop-color="#707780"/><stop offset="0.52" stop-color="#dfe2e3"/><stop offset="0.68" stop-color="#383e46"/><stop offset="0.84" stop-color="#bfc4c7"/><stop offset="1" stop-color="#4b5159"/>
